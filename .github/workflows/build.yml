name: Build GhostLock 5.4

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup GCC ARM64
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        
    - name: Build Binary
      run: |
        make build/ghostlock54
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ghostlock54-binary
        path: build/ghostlock54
